<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — مساعد المحاضرات</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/login.css">
</head>
<body class="login-body">

  <main class="login-card">

    <div class="brand login-brand">
      <span class="dot"></span>
      <h1>مساعد المحاضرات</h1>
    </div>

    <p class="login-hint" id="login-hint">سجّل دخولك عشان تكمّل مذاكرة محاضراتك.</p>

    <form id="login-form" novalidate>

      <label class="field">
        <span>البريد الإلكتروني</span>
        <input type="email" id="email" name="email" required
               autocomplete="email" dir="ltr" placeholder="you@example.com">
      </label>

      <label class="field">
        <span>كلمة المرور</span>
        <input type="password" id="password" name="password" required
               autocomplete="current-password" dir="ltr" placeholder="••••••••">
      </label>

      <!-- aria-live so a screen reader announces the failure, which is
           otherwise a silent colour change. -->
      <p class="login-error" id="login-error" role="alert" aria-live="polite" hidden></p>
      <p class="login-note" id="login-note" role="status" aria-live="polite" hidden></p>

      <button type="submit" class="login-button" id="login-button">
        <span id="login-button-label">دخول</span>
      </button>

    </form>

    <p class="login-foot" id="login-foot">
      <button type="button" class="link-button" id="show-forgot">
        نسيت كلمة المرور؟
      </button>
    </p>

    <!-- ---------- Step 1: ask for a code ---------- -->
    <form id="forgot-form" hidden novalidate>

      <p class="login-hint">
        اكتب بريدك وهنبعتلك كود من ٦ أرقام.
      </p>

      <label class="field">
        <span>البريد الإلكتروني</span>
        <input type="email" id="forgot-email" required
               autocomplete="email" dir="ltr" placeholder="you@example.com">
      </label>

      <p class="login-error" id="forgot-error" role="alert" aria-live="polite" hidden></p>
      <p class="login-note" id="forgot-note" role="status" aria-live="polite" hidden></p>

      <button type="submit" class="login-button" id="forgot-button">
        <span id="forgot-button-label">ابعت الكود</span>
      </button>

      <p class="login-foot">
        <button type="button" class="link-button" data-back>رجوع لتسجيل الدخول</button>
      </p>

    </form>

    <!-- ---------- Step 2: code + new password ---------- -->
    <form id="reset-form" hidden novalidate>

      <p class="login-hint" id="reset-hint">
        اكتب الكود اللي وصلك وكلمة المرور الجديدة.
      </p>

      <label class="field">
        <span>الكود</span>
        <!-- inputmode=numeric brings up the number pad on a phone; the value
             stays a string because a leading zero is part of the code. -->
        <input type="text" id="reset-code" required dir="ltr"
               inputmode="numeric" autocomplete="one-time-code"
               maxlength="10" placeholder="123456">
      </label>

      <label class="field">
        <span>كلمة المرور الجديدة</span>
        <input type="password" id="reset-password" required dir="ltr"
               autocomplete="new-password" minlength="8" placeholder="٨ حروف على الأقل">
      </label>

      <p class="login-error" id="reset-error" role="alert" aria-live="polite" hidden></p>
      <p class="login-note" id="reset-note" role="status" aria-live="polite" hidden></p>

      <button type="submit" class="login-button" id="reset-button">
        <span id="reset-button-label">غيّر كلمة المرور</span>
      </button>

      <p class="login-foot">
        <button type="button" class="link-button" id="resend">ابعت الكود تاني</button>
        &nbsp;·&nbsp;
        <button type="button" class="link-button" data-back>رجوع لتسجيل الدخول</button>
      </p>

    </form>

  </main>

  <script src="/static/auth.js"></script>
  <script src="/static/login.js"></script>

</body>
</html>
